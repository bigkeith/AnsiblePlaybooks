---
- name: Prepare Nodes
  hosts: k3s_cluster
  become: yes
  tasks:
    - name: Update cache and install curl
      apt:
        name: curl
        state: present
        update_cache: yes

- name: Setup K3s Master
  hosts: master
  become: yes
  tasks:
    - name: Install K3s Server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Read Node Token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Set token fact
      set_fact:
        token: "{{ node_token.content | b64decode | trim }}"

- name: Setup K3s Workers
  hosts: workers
  become: yes
  vars:
    master_ip: "192.168.1.150"
  tasks:
    - name: Join K3s Cluster
      shell: >
        curl -sfL https://get.k3s.io | 
        K3S_URL=https://{{ master_ip }}:6443 
        K3S_TOKEN={{ hostvars[groups['master'][0]]['token'] }} 
        sh -
      args:
        creates: /usr/local/bin/k3s

- name: Configure Local Kubectl
  hosts: master
  become: yes
  tasks:
    - name: Copy kubeconfig to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./k3s-proxmox.yaml
        flat: yes

    - name: Update IP in local kubeconfig
      delegate_to: localhost
      become: no
      replace:
        path: ./k3s-proxmox.yaml
        regexp: '127.0.0.1'
        replace: "{{ inventory_hostname }}"

- name: Install MetalLB
  hosts: master
  become: no
  vars:
    # CHANGE THESE to a free range in your network
    ip_range: "192.168.1.200-192.168.1.250"
  tasks:
    - name: Apply MetalLB Manifest
      shell: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.3/config/manifests/metallb-native.yaml

    - name: Wait for MetalLB Controller to be ready
      shell: kubectl wait --namespace metallb-system --for=condition=ready pod --selector=app=metallb --timeout=90s

    - name: Create IP Address Pool
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: first-pool
          namespace: metallb-system
        spec:
          addresses:
          - {{ ip_range }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: advertisement
          namespace: metallb-system
        spec:
          ipAddressPools:
          - first-pool
        EOF