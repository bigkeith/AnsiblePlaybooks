---
- name: Deploy a new Ubuntu VM to Proxmox
  hosts: proxmox_host #host
  gather_facts: no
  vars:
    proxmox_api_host: "192.168.1.100"
    proxmox_api_user: "ansible@pam"
    proxmox_api_token_id: "ansible@pam!ansible-token"
    # IMPORTANT: Use Ansible Vault for the token secret!
    # The variable should point to the decrypted variable name, not the file path.
    proxmox_api_token_secret: "vars/vault.yml"

    proxmox_node: "pve"
    vm_template_name: "ubuntu-2204-template"
    new_vm_id: 105
    new_vm_name: "ubuntu-webserver-01"

    # Cloud-init configuration variables
    # The 'ci_user' should be a simple username for the guest OS, not a Proxmox user.
    ci_user: "ansibleuser"
    ci_ssh_keys: |
      ssh-rsa  ansible@pve
    ci_ip: "192.168.1.150" # Removed /24 as it is not needed here
    ci_netmask: "24"
    ci_gw: "192.168.1.1"
    ci_dns: "192.168.1.101"

  tasks:
    - name: Create and configure a new VM from template
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ new_vm_id }}"
        name: "{{ new_vm_name }}"
        clone: "{{ vm_template_name }}"
        state: present
        
        # Hardware configuration
        cores: 2
        sockets: 1
        memory: 2048 # In MB
        cpu: host
        
        # CORRECTED DISK CONFIGURATION
        scsi:
          size: 50  # In GB
          storage: VGLOCAL3
          scsihw: virtio-scsi-pci
          
        # CORRECTED NETWORK CONFIGURATION
        net:
          bridge: vmbr0
          model: virtio
          tag: 100 # Optional, for VLANs
          
        # CORRECTED CLOUD-INIT CONFIGURATION
        ciuser: "{{ ci_user }}"
        sshkeys: "{{ ci_ssh_keys }}"
        # The 'ci_hostname' is no longer a parameter. It is automatically set from the 'name' parameter.
        ipconfig:
          net0: "ip={{ ci_ip }}/{{ ci_netmask }},gw={{ ci_gw }},dns={{ ci_dns }}"

    - name: Wait for the new VM to be reachable via SSH
      ansible.builtin.wait_for:
        host: "{{ ci_ip }}"
        port: 22
        timeout: 300 # seconds
        state: started
      delegate_to: localhost
      
    - name: Add new VM to a dynamic in-memory inventory group
      ansible.builtin.add_host:
        name: "{{ new_vm_name }}"
        hostname: "{{ ci_ip }}"
        groups: 
          - new_vms
        # The ansible_user should match the 'ci_user' set in the cloud-init config.
        ansible_user: "{{ ci_user }}"
        ansible_ssh_private_key_file: "~/.ssh/id_rsa"
      changed_when: false